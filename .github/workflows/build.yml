name: Build SAMP Mobile APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android NDK r23b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b

      - name: Fix C++ Compiler Warning Restrictions
        run: |
          # إزالة خيار -Werror المسبب للإيقاف من جميع ملفات CMake
          find . -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} +
          # إجبار نظام التجميع على تجاهل التحذيرات غير المسببة للانهيار
          find . -name "build.gradle" -exec sed -i 's/cppFlags "/cppFlags "-w -Wno-error /g' {} +

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Client-APK
          path: app/build/outputs/apk/debug/app-debug.apk
