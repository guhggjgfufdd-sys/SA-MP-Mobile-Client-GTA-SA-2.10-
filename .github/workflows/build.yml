name: Build SAMP Mobile 2.10 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android NDK r23b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23b

      - name: Auto-Include Headers & Suppress Warnings
        run: |
          # البحث عن جميع المجلدات التي تحتوي على ملفات .h وتضمينها في CMake تلقائياً
          find app/src/main/cpp -name "*.h" -exec dirname {} + | sort -u | while read -r dir; do
            echo "include_directories(\"${PWD}/$dir\")" >> app/src/main/cpp/CMakeLists.txt
          done

          # إجبار المترجم على تجاوز أخطاء وتنبيهات C++
          find . -name "CMakeLists.txt" -exec sed -i '1i set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -w -fpermissive -Wno-everything")' {} +
          find . -name "CMakeLists.txt" -exec sed -i '1i set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -w -fpermissive -Wno-everything")' {} +

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x test --continue

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-2.10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
